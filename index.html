<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
    />
</head>
<body>
    <div id="main">
        <div id="panel">
            <div class="ptop">
                <div class="elem">
                    <h2>Score</h2>
                    <div id="scoreVal" class="box">0</div>
                </div>
                <div class="elem">
                    <h2>Hit</h2>
                    <div id="hitVal" class="box">0</div>
                </div>
                <div class="elem">
                    <h2>Timer</h2>
                    <div id="timerVal" class="box">60</div>
                </div>
            </div>
            <div id="pbottom">
            </div>
            <div id="controls">
                <div id="howToPlay">
                    <button id="howToPlayBtn" class="controlBtn">How to Play</button>
                    <div id="instructions" class="hidden">
                        <p>Click on the bubbles that match the number shown under "Hit".</p>
                        <p>Each correct click increases your score.</p>
                    </div>
                </div>
                <div id="restartGame">
                    <button id="restartBtn" class="controlBtn">Restart</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
